name: Update PKGBUILD and publish to AUR

# Checks the upstream suzuri release feed, refreshes pkgver/sha256sums, commits
# the result, and pushes PKGBUILD + .SRCINFO to the AUR.
#
# Note: the commit this workflow makes is pushed with the default GITHUB_TOKEN,
# and GitHub deliberately does not start new workflow runs for such pushes.
# That is why updating and publishing live in the same workflow instead of a
# separate on-push workflow that would never fire.

on:
  schedule:
    # Daily. Upstream releases are infrequent; the job is cheap when there is
    # nothing to do (one request, no downloads).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a specific suzuri version (e.g. 0.5.4). Leave empty for the latest upstream release.'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths: ['PKGBUILD']

# Required so the workflow can push the refreshed PKGBUILD back to this repo.
permissions:
  contents: write

# Never let a scheduled run and a manual run publish to the AUR at once.
concurrency:
  group: aur-suzuri-bin
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh pkgver and checksums from upstream
        id: refresh
        env:
          FORCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n ${FORCE_VERSION:-} ]]; then
            ./scripts/update-pkgbuild.sh --force "$FORCE_VERSION"
          else
            ./scripts/update-pkgbuild.sh
          fi

      # .SRCINFO must be generated by makepkg, which refuses to run as root.
      # The Arch container gives us a real makepkg; we copy the PKGBUILD to a
      # directory owned by an unprivileged user inside it.
      - name: Regenerate .SRCINFO
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work:ro archlinux:base-devel \
            bash -euo pipefail -c '
              useradd -m builder
              install -d -o builder -g builder /build
              install -m 644 -o builder -g builder /work/PKGBUILD /build/PKGBUILD
              su builder -c "cd /build && makepkg --printsrcinfo"
            ' > .SRCINFO
          cat .SRCINFO

      - name: Commit refreshed PKGBUILD
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # No signing key exists on the runner; be explicit so a stray
          # commit.gpgsign setting cannot turn this into a hard failure.
          git config commit.gpgsign false
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "Nothing changed; skipping commit."
          else
            git commit -m "upgpkg: suzuri-bin ${{ steps.refresh.outputs.version }}"
            git push
          fi

      - name: Publish to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z ${AUR_SSH_PRIVATE_KEY:-} ]]; then
            echo '::error::Repository secret AUR_SSH_PRIVATE_KEY is not set (or is empty).'
            exit 1
          fi

          pkgname=$(sed -n 's/^pkgname=//p' PKGBUILD | head -1)
          version=$(sed -n 's/^pkgver=//p' PKGBUILD | head -1)

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'

          rm -rf /tmp/aur
          # Cloning a package that does not exist yet yields an empty repo; the
          # first push below creates it.
          git clone "ssh://aur@aur.archlinux.org/${pkgname}.git" /tmp/aur

          install -m 644 PKGBUILD .SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          git add -A
          if git diff --cached --quiet; then
            echo "AUR already up to date at ${version}."
          else
            git commit -m "${pkgname} ${version}"
            # AUR repositories use 'master'; the explicit refspec keeps this
            # correct whatever the clone's default branch name happens to be.
            git push origin HEAD:master
          fi
